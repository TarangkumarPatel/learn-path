services:
  - type: web
    name: learnpath
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_ALLOWED_HOSTS
        value: your-service-name.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://your-service-name.onrender.com
      - key: SQLITE_NAME
        value: /data/db.sqlite3
