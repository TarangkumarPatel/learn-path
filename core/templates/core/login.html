{% extends 'core/base.html' %}

{% block title %}LearnPath - Login{% endblock %}

{% block content %}
    <h1>Login</h1>
    <p>Sign in to continue your learning path.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <div class="row">
        <a class="btn btn-secondary" href="{% url 'admin:login' %}">Admin login</a>
        <a class="btn btn-secondary" href="{% url 'signup' %}">Create account</a>
        <a class="btn btn-secondary" href="{% url 'home' %}">Back to home</a>
    </div>
{% endblock %}
